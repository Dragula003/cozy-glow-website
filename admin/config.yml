backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    folder: "data/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["candle", "sachet", "gift", "wax-melt"]
      - label: "Tag"
        name: "tag"
        widget: "select"
        options:
          - { label: "None", value: "" }
          - { label: "Bestseller", value: "bestseller" }
          - { label: "New Arrival", value: "new" }
          - { label: "Limited Edition", value: "limited" }
          - { label: "Seasonal", value: "seasonal" }
      - { label: "Price (₹)", name: "price", widget: "number" }
      - { label: "Stock", name: "stock", widget: "number" }
      - { label: "Scent Notes", name: "scent", widget: "string" }
      - { label: "Description", name: "desc", widget: "text" }
      - { label: "Burn Time", name: "burn", widget: "string" }
      - { label: "Size / Weight", name: "size", widget: "string" }
      - label: "Card Color"
        name: "color"
        widget: "select"
        options:
          - { label: "Warm Cream", value: "#F3E8DC" }
          - { label: "Sage Green", value: "#EBF0E8" }
          - { label: "Blush", value: "#F5EEE8" }
          - { label: "Lavender", value: "#F0EAF5" }
          - { label: "Spice", value: "#FAEEE0" }
          - { label: "Cool Blue", value: "#E8F0F5" }
      - { label: "Product Image", name: "image", widget: "image", required: false }
      - { label: "Order Link", name: "link", widget: "string", required: false }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General"
        file: "data/settings/general.json"
        fields:
          - { label: "Hero Image", name: "hero_image", widget: "image" }
          - { label: "Hero Title", name: "hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_sub", widget: "text" }
          - { label: "About Image", name: "about_image", widget: "image" }
          - { label: "About Text 1", name: "about_text_1", widget: "text" }
          - { label: "About Text 2", name: "about_text_2", widget: "text" }
